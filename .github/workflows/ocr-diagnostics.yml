{
  "name": "OCR Diagnostics",
  "on": {
    "workflow_dispatch": {},
    "schedule": [
      {
        "cron": "0 3 * * 1"
      }
    ]
  },
  "jobs": {
    "ocr-benchmark": {
      "name": "OCR benchmark",
      "runs-on": "macos-26",
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "lfs": true
          }
        },
        {
          "name": "Run OCR benchmark",
          "run": "xcodebuild test -project MangaTranslator.xcodeproj -scheme OCRBenchmark -destination 'platform=macOS'"
        }
      ]
    }
  }
}
